name: Phase 2 discovery (research only)
on:
  workflow_dispatch:
    inputs:
      start_year:
        description: Earliest NCEI source year
        required: true
        default: '1950'
      end_year:
        description: Latest complete NCEI source year
        required: true
        default: '2025'
  schedule:
    - cron: "17 10 1 * *"
  push:
    branches: [main]
    paths:
      - "src/otdwx/pipeline.py"
      - "data/curated_candidates.json"
      - "tests/test_pipeline.py"
      - ".github/workflows/discovery.yml"
permissions:
  contents: write
concurrency:
  group: otdwx-discovery
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Download public archives and make unverified research leads
        run: python -m otdwx.pipeline --start-year "${START_YEAR}" --end-year "${END_YEAR}" --days 60
        env:
          START_YEAR: ${{ inputs.start_year || '1950' }}
          END_YEAR: ${{ inputs.end_year || '2025' }}
      - name: Save CSV review exports
        uses: actions/upload-artifact@v4
        with:
          name: research-candidates
          path: |
            exports/discovery_feed.csv
            exports/daily_suggestions.csv
            data/discovery_candidates.json
            data/editorial_handoff.json
          retention-days: 60
      - name: Save machine-readable candidate catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovery_candidates.json data/editorial_handoff.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): update unverified candidate research catalog [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
