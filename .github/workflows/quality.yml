name: Phase 1 quality checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check event and publication JSON
        run: python -m otdwx validate-data
      - name: Audit Phase A anniversary and evidence integrity
        run: python -m otdwx.phase_a --audit
